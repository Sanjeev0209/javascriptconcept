<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Debounce vs Throttle Demo</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.5;
    }
    .box {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 24px;
    }
    input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      box-sizing: border-box;
      margin-top: 8px;
    }
    .scroll-area {
      height: 150px;
      overflow-y: scroll;
      border: 1px solid #ddd;
      background: #f9f9f9;
      padding: 12px;
      margin-top: 8px;
    }
    .scroll-content {
      height: 600px;
    }
    .output {
      margin-top: 10px;
      font-weight: bold;
      color: #0b57d0;
    }
  </style>
</head>
<body>

  <!-- Debounce Example -->
  <div class="box">
    <h3>1. Debounce (Typing)</h3>
    <p>Type quickly below. Updates only <strong>500ms after</strong> you stop typing.</p>
    <input type="text" id="searchInput" placeholder="Start typing..." />
    <div class="output" id="debounceOutput">Debounced value: (waiting)</div>
  </div>

  <!-- Throttle Example -->
  <div class="box">
    <h3>2. Throttle (Scrolling)</h3>
    <p>Scroll rapidly inside the box. Updates at most <strong>once every 1000ms</strong>.</p>
    <div class="scroll-area" id="scrollBox">
      <div class="scroll-content">Scroll down inside this box...</div>
    </div>
    <div class="output" id="throttleOutput">Scroll count: 0</div>
  </div>

  <script>
    // Debounce helper
    function debounce(func, delay) {
      let timeoutId;
      return function (...args) {
        clearTimeout(timeoutId);
        timeoutId = setTimeout(() => {
          func.apply(this, args);
        }, delay);
      };
    }

    // Throttle helper
    function throttle(func, limit) {
      let inThrottle = false;
      return function (...args) {
        if (!inThrottle) {
          func.apply(this, args);
          inThrottle = true;
          setTimeout(() => {
            inThrottle = false;
          }, limit);
        }
      };
    }

    // Hook up Debounce to input
    const searchInput = document.getElementById("searchInput");
    const debounceOutput = document.getElementById("debounceOutput");

    const updateSearch = debounce((text) => {
      debounceOutput.textContent = `Debounced value: "${text}"`;
    }, 500);

    searchInput.addEventListener("input", (e) => {
      updateSearch(e.target.value);
    });

    // Hook up Throttle to scroll container
    const scrollBox = document.getElementById("scrollBox");
    const throttleOutput = document.getElementById("throttleOutput");
    let throttledScrollCount = 0;

    const handleScroll = throttle(() => {
      throttledScrollCount++;
      throttleOutput.textContent = `Scroll count: ${throttledScrollCount} (Position: ${Math.round(scrollBox.scrollTop)}px)`;
    }, 1000);

    scrollBox.addEventListener("scroll", handleScroll);
  </script>

</body>
</html>
